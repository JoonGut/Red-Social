<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro · NeonNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/index.css" />
  <script src="../js/validaciones_registro.js" defer></script>
  <link rel="icon" href="../multimedia/file.svg">
</head>
<body style="display: grid; place-items: center; min-height: 100vh;">

  <div class="panel" style="width: 100%; max-width: 420px; text-align: center;">
    
    <div class="logo-red" style="justify-content: center; margin-bottom: 20px; border-bottom: none;">
      <div class="logo-mark">
        <img src="../multimedia/file.svg" alt="Logo" style="width: 24px; height: 24px;">
      </div>
      <div class="logo-copy" style="text-align: left;">
        <strong>NeonNest</strong>
        <small>Corporation</small>
      </div>
    </div>

    <h2 style="margin-bottom: 10px;">Únete hoy</h2>
    <p style="color: var(--muted); font-size: 14px; margin-bottom: 24px;">Regístrate y empieza a compartir lo que piensas</p>

    <div id="mensaje-error" style="color: #ff4757; margin-bottom: 15px; font-size: 14px; min-height: 1em;"></div>

    <form class="formulario-registro" action="../php/registro.php" method="POST" novalidate>
      
      <div style="margin-bottom: 16px; text-align: left;">
        <label for="nombre" style="color: var(--muted); font-size: 13px; display: block; margin-bottom: 8px; margin-left: 4px;">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" class="composer-input" placeholder="Tu nombre" style="cursor: text;" required />
        <span class="error-msg" style="color: #ff4757; font-size: 11px; margin-left: 4px;"></span>
      </div>

      <div style="margin-bottom: 16px; text-align: left;">
        <label for="usuario" style="color: var(--muted); font-size: 13px; display: block; margin-bottom: 8px; margin-left: 4px;">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" class="composer-input" placeholder="@usuario" style="cursor: text;" required />
        <span class="error-msg" style="color: #ff4757; font-size: 11px; margin-left: 4px;"></span>
      </div>

      <div style="margin-bottom: 16px; text-align: left;">
        <label for="email" style="color: var(--muted); font-size: 13px; display: block; margin-bottom: 8px; margin-left: 4px;">Correo electrónico</label>
        <input type="email" id="email" name="email" class="composer-input" placeholder="correo@ejemplo.com" style="cursor: text;" required />
        <span class="error-msg" style="color: #ff4757; font-size: 11px; margin-left: 4px;"></span>
      </div>

      <div style="margin-bottom: 16px; text-align: left;">
        <label for="password" style="color: var(--muted); font-size: 13px; display: block; margin-bottom: 8px; margin-left: 4px;">Contraseña</label>
        <input type="password" id="password" name="password" class="composer-input" placeholder="••••••••" style="cursor: text;" required />
        <span class="error-msg" style="color: #ff4757; font-size: 11px; margin-left: 4px;"></span>
      </div>

      <div style="margin-bottom: 24px; text-align: left;">
        <label for="password_confirm" style="color: var(--muted); font-size: 13px; display: block; margin-bottom: 8px; margin-left: 4px;">Confirmar contraseña</label>
        <input type="password" id="password_confirm" name="password_confirm" class="composer-input" placeholder="••••••••" style="cursor: text;" required />
        <span class="error-msg" style="color: #ff4757; font-size: 11px; margin-left: 4px;"></span>
      </div>

      <button type="submit" class="boton-registrarse">
        Crear cuenta
      </button>
    </form>

    <div style="margin-top: 24px; font-size: 13px; color: var(--muted); line-height: 1.6;">
      ¿Ya tienes cuenta? 
      <a href="../login.html" style="color: var(--accent2); text-decoration: none;">Inicia sesión</a>
    </div>
  </div>

</body>
</html>
